<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phong cách giao tiếp - VANTIS Games</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --ink: #0d223f;
        --blue: #2f80ed;
        --teal: #20c5b5;
        --purple: #6b45a8;
        --paper: #f7fbff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 12% 10%, rgba(47, 128, 237, 0.14), transparent 30%),
          radial-gradient(circle at 88% 12%, rgba(107, 69, 168, 0.12), transparent 28%),
          linear-gradient(180deg, #ffffff 0%, var(--paper) 64%, #eef7fb 100%);
        color: #102033;
      }

      .wrap {
        margin: 0 auto;
        max-width: 1180px;
        padding: 0 24px;
      }

      .logo {
        height: auto;
        width: min(220px, 58vw);
      }

      .quiz-card,
      .answer-card {
        box-shadow:
          0 18px 42px rgba(47, 128, 237, 0.1),
          0 8px 18px rgba(13, 34, 63, 0.05),
          inset 0 1px 0 rgba(255, 255, 255, 0.95);
      }

      .face {
        aspect-ratio: 1 / 1;
        border-radius: 26px;
        background-image: url("../../assets/communication-style-faces.png");
        background-repeat: no-repeat;
        background-size: 300% 200%;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
      }

      .face.anonymous {
        background-image: url("../../assets/andanh.jpg");
        background-position: center !important;
        background-size: cover;
      }

      .face-avatar {
        height: 168px;
        width: 168px;
        flex: 0 0 auto;
        border: 8px solid rgba(255, 255, 255, 0.92);
        border-radius: 999px;
        box-shadow:
          0 18px 38px rgba(13, 34, 63, 0.12),
          0 0 0 1px rgba(47, 128, 237, 0.12);
      }

      .answer-face {
        height: 132px;
        width: 132px;
        border-width: 6px;
      }

      .option-btn {
        transition:
          transform 140ms ease,
          border-color 140ms ease,
          background 140ms ease;
      }

      .option-btn:hover {
        transform: translateY(-2px);
      }

      .option-btn.selected {
        border-color: rgba(47, 128, 237, 0.62);
        background: #eff7ff;
        color: var(--ink);
      }

      .option-btn.answer-correct {
        border-color: #16a34a;
        background: #dcfce7;
        color: #14532d;
        box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.12);
      }

      .option-btn.answer-wrong {
        border-color: #dc2626;
        background: #fee2e2;
        color: #7f1d1d;
      }

      .inline-answer {
        border: 2px solid rgba(22, 163, 74, 0.32);
        background: #f0fdf4;
        box-shadow:
          0 14px 32px rgba(47, 128, 237, 0.08),
          inset 0 1px 0 rgba(255, 255, 255, 0.96);
      }

      .quiz-card.correct {
        border-color: #16a34a;
        border-width: 3px;
        background: linear-gradient(145deg, #ecfdf5 0%, #ffffff 46%);
      }

      .quiz-card.wrong {
        border-color: #dc2626;
        border-width: 3px;
        background: linear-gradient(145deg, #fff1f2 0%, #ffffff 46%);
      }

      .result-badge {
        border-radius: 999px;
        display: inline-flex;
        font-size: 13px;
        font-weight: 900;
        letter-spacing: 0.08em;
        padding: 8px 12px;
        text-transform: uppercase;
      }

      @media (max-width: 767px) {
        .wrap {
          padding: 0 16px;
        }

        .face-avatar {
          height: 132px;
          width: 132px;
        }
      }
    </style>
  </head>
  <body>
    <main class="min-h-screen">
      <header class="wrap flex items-center justify-between gap-4 py-6">
        <a href="../../" aria-label="Về trang chủ">
          <img src="../../assets/vantis-logo.png" alt="VANTIS" class="logo" />
        </a>
        <a
          href="../../"
          class="rounded-full border border-slate-200 bg-white/82 px-4 py-2 text-sm font-bold text-slate-600 shadow-sm transition hover:text-[var(--ink)]"
        >
          Trang chủ
        </a>
      </header>

      <section class="wrap pb-12 pt-2">
        <div class="mb-6">
          <p class="text-sm font-black uppercase tracking-[0.18em] text-slate-400">
            Phong cách giao tiếp
          </p>
          <h1 class="mt-2 text-3xl font-black leading-tight text-[var(--ink)] md:text-5xl">
            Đoán phong cách qua gợi ý
          </h1>
        </div>

        <div id="quizGrid" class="grid gap-5 lg:grid-cols-2"></div>

        <div class="mt-6 rounded-2xl border border-blue-100 bg-white/78 p-3">
          <div class="flex flex-wrap items-center justify-center gap-3">
            <button
              id="submitBtn"
              class="min-h-12 rounded-xl bg-[var(--ink)] px-8 text-base font-black text-white shadow-lg shadow-slate-300 transition hover:bg-slate-900"
            >
              Nộp bài
            </button>
            <button
              id="resetBtn"
              class="min-h-12 rounded-xl border border-slate-200 bg-white px-6 text-base font-black text-slate-600 shadow-sm transition hover:text-[var(--ink)]"
            >
              Chơi lại
            </button>
            <p id="scoreText" class="hidden text-sm font-black text-slate-600"></p>
          </div>
        </div>
      </section>
    </main>

    <script>
      const styles = [
        {
          id: "expressiveness",
          label: "Thể hiện",
          english: "Expressiveness",
          strength: "Sôi nổi, truyền cảm hứng, dễ kết nối.",
          weakness: "Dễ nói nhiều, lấn át hoặc thiếu lắng nghe.",
          position: "0% 0%",
        },
        {
          id: "preciseness",
          label: "Chính xác",
          english: "Preciseness",
          strength: "Rõ ràng, đáng tin cậy, làm việc có hệ thống.",
          weakness: "Dễ bị xem là khô khan hoặc quá cứng nhắc.",
          position: "50% 0%",
        },
        {
          id: "verbal-aggressiveness",
          label: "Hung hăng ngôn từ",
          english: "Verbal Aggressiveness",
          strength: "Quyết đoán, bảo vệ quan điểm mạnh trong tình huống khẩn cấp.",
          weakness: "Dễ gây mâu thuẫn hoặc tạo cảm giác căng thẳng.",
          position: "100% 0%",
        },
        {
          id: "questioningness",
          label: "Hỏi nhiều",
          english: "Questioningness",
          strength: "Đào sâu vấn đề, mở ra góc nhìn mới.",
          weakness: "Dễ bị xem là soi mói hoặc làm chậm thảo luận.",
          position: "0% 100%",
        },
        {
          id: "emotionality",
          label: "Cảm xúc",
          english: "Emotionality",
          strength: "Thấu cảm, chân thành, dễ tạo niềm tin.",
          weakness: "Dễ bị cảm xúc chi phối khi gặp áp lực.",
          position: "50% 100%",
        },
        {
          id: "impression-manipulativeness",
          label: "Kiểm soát ấn tượng",
          english: "Impression Manipulativeness",
          strength: "Thuyết phục tốt, ngoại giao khéo léo.",
          weakness: "Dễ bị đánh giá là thiếu chân thành nếu quá tính toán.",
          position: "100% 100%",
        },
      ];

      const situations = [
        {
          id: "case-verbal-aggressiveness",
          answerId: "verbal-aggressiveness",
          title: "Cuộc họp bị kéo dài",
          situation:
            "Khi nhóm tranh luận mãi chưa ra quyết định, anh Khoa nói thẳng rằng cách hiện tại đang vòng vo, yêu cầu chốt ngay phương án và phản biện khá mạnh với những ý kiến anh cho là thiếu căn cứ.",
          clue: "Nói trực diện, quyết liệt và dễ tạo áp lực.",
          explanation:
            "Người này dùng lời nói mạnh để thúc đẩy hành động và bảo vệ quan điểm. Dấu hiệu chính là sự trực diện, phản biện gay gắt và ít né tránh xung đột.",
          position: "100% 0%",
        },
        {
          id: "case-emotionality",
          answerId: "emotionality",
          title: "Nhân sự vừa mắc lỗi",
          situation:
            "Một bạn trong nhóm làm sai báo cáo và rất lo lắng. Chị Mai không trách ngay, chị hỏi bạn đang cảm thấy thế nào, trấn an trước rồi mới cùng xem lại lỗi để sửa.",
          clue: "Phản ứng bằng sự thấu cảm và quan tâm cảm xúc.",
          explanation:
            "Người này ưu tiên cảm xúc và sự an toàn tâm lý trong trao đổi. Dấu hiệu rõ là lắng nghe cảm xúc trước khi đi vào xử lý công việc.",
          position: "50% 100%",
        },
        {
          id: "case-preciseness-2",
          answerId: "preciseness",
          title: "Bàn giao ca làm",
          situation:
            "Trước khi rời ca, anh Phúc ghi lại từng việc đã xong, việc còn mở, số liệu cần theo dõi và người nhận tiếp theo. Anh nhắc mọi người kiểm tra theo checklist để tránh bỏ sót.",
          clue: "Có hệ thống, rõ đầu việc và tiêu chuẩn kiểm tra.",
          explanation:
            "Người này giao tiếp theo hướng chính xác và có cấu trúc. Dấu hiệu là dùng checklist, số liệu và trách nhiệm rõ ràng để giảm sai sót.",
          position: "50% 0%",
        },
        {
          id: "case-expressiveness-2",
          answerId: "expressiveness",
          title: "Giới thiệu ý tưởng mới",
          situation:
            "Trong buổi chia sẻ nội bộ, chị Linh nói rất sinh động, dùng ví dụ gần gũi, thay đổi giọng điệu liên tục và làm cả phòng cười trước khi đi vào ý chính.",
          clue: "Biểu cảm rõ, giàu năng lượng và dễ kéo người nghe vào câu chuyện.",
          explanation:
            "Người này gây ảnh hưởng bằng sự sinh động trong cách nói. Dấu hiệu là nhiều ví dụ, biểu cảm, giọng điệu thay đổi và khả năng tạo không khí.",
          position: "0% 0%",
        },
      ];

      let activeQuestions = [];
      const answers = new Map();

      function shuffle(items) {
        return [...items].sort(() => Math.random() - 0.5);
      }

      function renderQuiz() {
        const grid = document.getElementById("quizGrid");
        const reviewQuestions = styles.map((style) => ({
          ...style,
          type: "review",
          answerId: style.id,
          title: "Đoán phong cách phù hợp",
          explanation:
            "Dựa vào cặp điểm mạnh và điểm yếu, đây là phong cách giao tiếp khớp nhất với mô tả.",
        }));
        const caseQuestions = situations.map((situation) => ({
          ...situation,
          type: "case",
        }));
        activeQuestions = [...reviewQuestions, ...caseQuestions];
        grid.innerHTML = activeQuestions.map(createQuestionCard).join("");

        document.querySelectorAll(".option-btn").forEach((button) => {
          button.addEventListener("click", selectOption);
        });

        document.getElementById("scoreText").classList.add("hidden");
      }

      function createQuestionCard(question, index) {
        const body =
          question.type === "review"
            ? `
              <div class="grid gap-3 md:grid-cols-2">
                <div class="rounded-2xl bg-green-50 p-4">
                  <p class="text-xs font-black uppercase tracking-[0.16em] text-green-700">Điểm mạnh</p>
                  <p class="mt-2 text-sm font-bold leading-6 text-slate-700">${question.strength}</p>
                </div>
                <div class="rounded-2xl bg-rose-50 p-4">
                  <p class="text-xs font-black uppercase tracking-[0.16em] text-rose-700">Điểm yếu</p>
                  <p class="mt-2 text-sm font-bold leading-6 text-slate-700">${question.weakness}</p>
                </div>
              </div>
            `
            : `
              <div class="rounded-2xl bg-slate-50 p-4">
                <p class="text-sm font-bold leading-6 text-slate-700">${question.situation}</p>
              </div>
              <div class="mt-3 rounded-2xl bg-blue-50 p-4">
                <p class="text-xs font-black uppercase tracking-[0.16em] text-blue-700">Dấu hiệu</p>
                <p class="mt-2 text-sm font-bold leading-6 text-slate-700">${question.clue}</p>
              </div>
            `;

        const options = shuffle(styles)
          .map(
            (item) => `
              <button
                class="option-btn rounded-xl border border-slate-200 bg-white px-4 py-3 text-left font-black text-slate-500"
                type="button"
                data-question="${question.id}"
                data-answer="${item.id}"
              >
                ${item.label}
              </button>
            `
          )
          .join("");

        return `
          <article id="${question.id}" class="quiz-card rounded-3xl border border-blue-100 bg-white/88 p-5">
            <div class="result-slot mb-4 hidden"></div>
            <div class="mb-5 flex flex-col gap-5 sm:flex-row sm:items-center">
              <div
                class="face face-avatar ${question.type === "case" ? "anonymous" : ""}"
                style="background-position: ${question.position};"
              ></div>
              <div class="min-w-0">
                <p class="text-xs font-black uppercase tracking-[0.18em] text-slate-400">
                  ${question.type === "review" ? `Gợi ý ${index + 1}` : `Tình huống ${index + 1}`}
                </p>
                <p class="mt-2 text-xl font-black leading-tight text-[var(--ink)]">${question.title}</p>
              </div>
            </div>
            ${body}
            <div class="mt-4 grid gap-2 sm:grid-cols-2">${options}</div>
            <div class="inline-answer mt-4 hidden rounded-2xl bg-white p-4"></div>
          </article>
        `;
      }

      function selectOption(event) {
        const button = event.currentTarget;
        const questionId = button.dataset.question;

        answers.set(questionId, button.dataset.answer);

        document
          .querySelectorAll(`[data-question="${questionId}"]`)
          .forEach((item) => item.classList.remove("selected"));

        button.classList.add("selected");
      }

      function submitQuiz() {
        let score = 0;

        activeQuestions.forEach((question) => {
          const correctStyle = styles.find((style) => style.id === question.answerId);
          const card = document.getElementById(question.id);
          const selected = answers.get(question.id);
          const selectedStyle = styles.find((style) => style.id === selected);
          const inlineAnswer = card.querySelector(".inline-answer");
          const resultSlot = card.querySelector(".result-slot");
          card.classList.remove("correct", "wrong");
          card
            .querySelectorAll(".option-btn")
            .forEach((button) => button.classList.remove("answer-correct", "answer-wrong"));

          if (selected === question.answerId) {
            score++;
            card.classList.add("correct");
            resultSlot.innerHTML = `<span class="result-badge bg-green-600 text-white">Đúng</span>`;
          } else {
            card.classList.add("wrong");
            resultSlot.innerHTML = `<span class="result-badge bg-red-600 text-white">Sai</span>`;
          }

          resultSlot.classList.remove("hidden");

          const correctButton = card.querySelector(`[data-answer="${question.answerId}"]`);
          if (correctButton) {
            correctButton.classList.add("answer-correct");
          }

          if (selected && selected !== question.answerId) {
            const selectedButton = card.querySelector(`[data-answer="${selected}"]`);
            if (selectedButton) {
              selectedButton.classList.add("answer-wrong");
            }
          }

          inlineAnswer.classList.remove("hidden");
          inlineAnswer.innerHTML =
            question.type === "review"
              ? `
                <p class="text-xs font-black uppercase tracking-[0.16em] text-slate-400">Đáp án</p>
                <p class="mt-2 text-sm font-bold text-slate-600">Bạn chọn: <span class="font-black ${selected === question.answerId ? "text-green-700" : "text-red-700"}">${selectedStyle ? selectedStyle.label : "Chưa chọn"}</span></p>
                <p class="mt-2 text-lg font-black text-[var(--ink)]">Đáp án đúng: ${correctStyle.label}</p>
                <p class="mt-1 text-sm font-black text-slate-500">${correctStyle.english}</p>
              `
              : `
                <p class="text-xs font-black uppercase tracking-[0.16em] text-slate-400">Đáp án</p>
                <p class="mt-2 text-sm font-bold text-slate-600">Bạn chọn: <span class="font-black ${selected === question.answerId ? "text-green-700" : "text-red-700"}">${selectedStyle ? selectedStyle.label : "Chưa chọn"}</span></p>
                <p class="mt-2 text-lg font-black text-[var(--ink)]">Đáp án đúng: ${correctStyle.label}</p>
                <p class="mt-1 text-sm font-black text-slate-500">${correctStyle.english}</p>
                <p class="mt-3 text-sm leading-6 text-slate-600"><span class="font-black text-blue-700">Vì sao:</span> ${question.explanation}</p>
              `;

          if (question.type === "case") {
            const face = card.querySelector(".face-avatar");
            face.classList.remove("anonymous");
            face.style.backgroundPosition = correctStyle.position;
          }
        });

        const scoreText = document.getElementById("scoreText");
        scoreText.textContent = `${score}/${activeQuestions.length} câu đúng`;
        scoreText.classList.remove("hidden");
      }

      function resetQuiz() {
        answers.clear();
        renderQuiz();
      }

      document.getElementById("submitBtn").addEventListener("click", submitQuiz);
      document.getElementById("resetBtn").addEventListener("click", resetQuiz);

      renderQuiz();
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quy trình đội nhóm - VANTIS Games</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --ink: #0d223f;
        --blue: #2f80ed;
        --teal: #20c5b5;
        --green: #17813b;
        --orange: #ef8a00;
        --red: #e94855;
        --paper: #f7fbff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 12% 10%, rgba(47, 128, 237, 0.14), transparent 30%),
          radial-gradient(circle at 88% 12%, rgba(32, 197, 181, 0.12), transparent 28%),
          linear-gradient(180deg, #ffffff 0%, var(--paper) 64%, #eef7fb 100%);
        color: #102033;
      }

      .wrap {
        margin: 0 auto;
        max-width: 1360px;
        padding: 0 24px;
      }

      .logo {
        height: auto;
        width: min(220px, 58vw);
      }

      .step-card,
      .slot,
      .answer-card {
        box-shadow:
          0 18px 42px rgba(47, 128, 237, 0.1),
          0 8px 18px rgba(13, 34, 63, 0.05),
          inset 0 1px 0 rgba(255, 255, 255, 0.95);
      }

      .step-card {
        cursor: grab;
        touch-action: none;
        transition:
          transform 150ms ease,
          box-shadow 150ms ease,
          opacity 150ms ease;
      }

      .step-card.selected {
        border-color: rgba(47, 128, 237, 0.7);
        outline: 4px solid rgba(47, 128, 237, 0.16);
        transform: translateY(-4px);
      }

      .step-card:hover {
        transform: translateY(-4px);
        box-shadow:
          0 24px 54px rgba(47, 128, 237, 0.16),
          0 10px 24px rgba(13, 34, 63, 0.08);
      }

      .step-card.dragging {
        opacity: 0.55;
        transform: scale(0.97);
      }

      .slot {
        cursor: pointer;
        min-height: 104px;
        transition:
          border-color 150ms ease,
          background 150ms ease,
          transform 150ms ease;
      }

      .slot:hover {
        border-color: rgba(47, 128, 237, 0.5);
        background: #f8fcff;
      }

      .slot.drag-over {
        border-color: rgba(47, 128, 237, 0.72);
        background: #f0f8ff;
        transform: translateY(-3px);
      }

      .slot.correct {
        border-color: #16a34a;
        border-width: 3px;
        background: #dcfce7;
      }

      .slot.wrong {
        border-color: #dc2626;
        border-width: 3px;
        background: #fee2e2;
      }

      .flow-arrow {
        color: #9aa9bd;
        font-size: 28px;
        font-weight: 900;
        line-height: 1;
      }

      @media (max-width: 767px) {
        .wrap {
          padding: 0 16px;
        }
      }
    </style>
  </head>
  <body>
    <main class="min-h-screen">
      <header class="wrap flex items-center justify-between gap-4 py-6">
        <a href="../../" aria-label="Về trang chủ">
          <img src="../../assets/vantis-logo.png" alt="VANTIS" class="logo" />
        </a>
        <a
          href="../../"
          class="rounded-full border border-slate-200 bg-white/82 px-4 py-2 text-sm font-bold text-slate-600 shadow-sm transition hover:text-[var(--ink)]"
        >
          Trang chủ
        </a>
      </header>

      <section class="wrap pb-12 pt-2">
        <div class="mb-6">
          <p class="text-sm font-black uppercase tracking-[0.18em] text-slate-400">
            Quy trình đội nhóm
          </p>
          <h1 class="mt-2 text-3xl font-black leading-tight text-[var(--ink)] md:text-5xl">
            Xếp đúng luồng quy trình
          </h1>
          <p id="selectedText" class="mt-3 text-base font-bold text-slate-600">
            Bấm chọn một bước, rồi bấm vào vị trí muốn đặt.
          </p>
        </div>

        <div class="grid gap-6 xl:grid-cols-[0.82fr_1.18fr]">
          <section class="rounded-3xl border border-blue-100 bg-white/86 p-5">
            <div class="mb-4 flex items-center justify-between gap-3">
              <h2 class="text-lg font-black text-[var(--ink)]">Các bước</h2>
              <button
                id="resetBtn"
                class="rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-bold text-slate-600 transition hover:text-[var(--ink)]"
              >
                Chơi lại
              </button>
            </div>
            <div id="stepPool" class="grid gap-3 sm:grid-cols-3 xl:grid-cols-2"></div>
          </section>

          <section>
            <div id="slots" class="grid gap-3 lg:grid-cols-2"></div>
            <button
              id="submitBtn"
              class="mt-4 min-h-12 w-full rounded-xl bg-[var(--ink)] px-5 text-base font-black text-white shadow-lg shadow-slate-300 transition hover:bg-slate-900"
            >
              Nộp bài
            </button>
          </section>
        </div>

        <section id="answersPanel" class="mt-8 hidden">
          <div class="mb-4 flex items-center justify-between gap-4">
            <h2 class="text-2xl font-black text-[var(--ink)]">Đáp án</h2>
            <p id="scoreText" class="text-sm font-bold text-slate-500"></p>
          </div>
          <div id="answersGrid" class="grid gap-4 md:grid-cols-2 xl:grid-cols-4"></div>
        </section>
      </section>
    </main>

    <script>
      const steps = [
        {
          id: "input",
          title: "Input",
          detail: "Yêu cầu, thông tin, dữ liệu, tài liệu, nguồn lực, điều kiện.",
          color: "#17813b",
        },
        {
          id: "process",
          title: "Process",
          detail: "Thực hiện các bước xử lý theo owner, SOP, checklist, tiêu chuẩn và điểm kiểm soát.",
          color: "#2f80ed",
        },
        {
          id: "quality",
          title: "Quality Check",
          detail: "Kiểm tra chất lượng theo tiêu chuẩn.",
          color: "#6b45a8",
        },
        {
          id: "output",
          title: "Output",
          detail: "Sản phẩm, báo cáo, dữ liệu, quyết định hoặc dịch vụ.",
          color: "#17813b",
        },
        {
          id: "standard",
          title: "Đạt tiêu chuẩn?",
          detail: "Nếu đạt thì chuyển bước tiếp theo; nếu chưa đạt thì quay về vòng cải thiện.",
          color: "#ef8a00",
        },
        {
          id: "adjust",
          title: "Điều chỉnh",
          detail: "Điều chỉnh tạm thời để khắc phục.",
          color: "#e94855",
        },
        {
          id: "cause",
          title: "Phân tích nguyên nhân",
          detail: "Tìm nguyên nhân gốc rễ của vấn đề.",
          color: "#ef8a00",
        },
        {
          id: "normalize",
          title: "Chuẩn hóa",
          detail: "Cập nhật tiêu chuẩn, SOP và hướng dẫn.",
          color: "#2f80ed",
        },
        {
          id: "improve",
          title: "Cải tiến",
          detail: "Cải tiến quy trình, nâng cao hiệu quả rồi đưa vào vận hành lại.",
          color: "#6b45a8",
        },
      ];

      let draggedCard = null;
      let selectedCard = null;

      function shuffle(items) {
        return [...items].sort(() => Math.random() - 0.5);
      }

      function initGame() {
        renderPool();
        renderSlots();
        renderAnswers();
        document.getElementById("answersPanel").classList.add("hidden");
      }

      function renderPool() {
        const pool = document.getElementById("stepPool");
        pool.innerHTML = "";
        shuffle(steps).forEach((step) => pool.appendChild(createStepCard(step)));
      }

      function createStepCard(step) {
        const card = document.createElement("div");
        card.className = "step-card rounded-2xl border border-blue-100 bg-white p-4";
        card.draggable = true;
        card.dataset.id = step.id;
        card.innerHTML = `
          <div class="mb-3 h-3 w-16 rounded-full" style="background: ${step.color};"></div>
          <p class="text-lg font-black text-[var(--ink)]">${step.title}</p>
          <p class="mt-2 text-sm leading-6 text-slate-600">${step.detail}</p>
        `;
        card.addEventListener("dragstart", handleDragStart);
        card.addEventListener("dragend", handleDragEnd);
        card.addEventListener("click", handleCardClick);
        return card;
      }

      function renderSlots() {
        const slots = document.getElementById("slots");
        slots.innerHTML = "";

        steps.forEach((step, index) => {
          const slot = document.createElement("div");
          slot.className = "slot rounded-2xl border border-dashed border-blue-200 bg-white/86 p-4";
          slot.dataset.answer = step.id;
          slot.innerHTML = `
            <div class="flex min-h-[82px] items-center gap-4">
              <div class="flex h-14 w-14 shrink-0 items-center justify-center rounded-xl bg-slate-100 text-xl font-black text-slate-300">
                ${index + 1}
              </div>
              <div class="slot-content flex min-h-14 flex-1 items-center text-sm font-bold text-slate-400">
                Kéo bước vào đây
              </div>
            </div>
          `;
          slot.addEventListener("dragover", handleDragOver);
          slot.addEventListener("dragenter", handleDragEnter);
          slot.addEventListener("dragleave", handleDragLeave);
          slot.addEventListener("drop", handleDrop);
          slot.addEventListener("click", handleSlotClick);
          slots.appendChild(slot);
        });
      }

      function renderAnswers() {
        const grid = document.getElementById("answersGrid");
        grid.innerHTML = steps
          .map(
            (step, index) => `
              <article class="answer-card rounded-2xl border border-blue-100 bg-white p-4">
                <p class="text-xs font-black uppercase tracking-[0.16em] text-slate-400">Bước ${index + 1}</p>
                <div class="mt-3 h-3 w-16 rounded-full" style="background: ${step.color};"></div>
                <p class="mt-4 text-lg font-black text-[var(--ink)]">${step.title}</p>
                <p class="mt-2 text-sm leading-6 text-slate-600">${step.detail}</p>
              </article>
            `
          )
          .join("");
      }

      function handleDragStart(event) {
        draggedCard = event.currentTarget;
        draggedCard.classList.add("dragging");
      }

      function handleDragEnd() {
        if (draggedCard) {
          draggedCard.classList.remove("dragging");
        }
        draggedCard = null;
      }

      function handleDragOver(event) {
        event.preventDefault();
      }

      function handleDragEnter(event) {
        event.currentTarget.classList.add("drag-over");
      }

      function handleDragLeave(event) {
        event.currentTarget.classList.remove("drag-over");
      }

      function handleDrop(event) {
        event.preventDefault();
        const slot = event.currentTarget;

        slot.classList.remove("drag-over", "correct", "wrong");
        if (!draggedCard) return;

        placeCardInSlot(draggedCard, slot);
      }

      function handleCardClick(event) {
        const card = event.currentTarget;
        if (selectedCard === card) {
          clearSelectedCard();
          return;
        }

        clearSelectedCard();
        selectedCard = card;
        selectedCard.classList.add("selected");
        document.getElementById("selectedText").textContent = `Đang chọn: ${card.querySelector("p").textContent}`;
      }

      function handleSlotClick(event) {
        const slot = event.currentTarget;
        if (!selectedCard || event.target.closest(".step-card")) return;

        placeCardInSlot(selectedCard, slot);
        clearSelectedCard();
      }

      function placeCardInSlot(card, slot) {
        const content = slot.querySelector(".slot-content");
        const pool = document.getElementById("stepPool");

        slot.classList.remove("correct", "wrong");

        const existing = content.querySelector(".step-card");
        if (existing && existing !== card) {
          pool.appendChild(existing);
        }

        content.textContent = "";
        content.appendChild(card);
        refreshPlaceholders();
      }

      function clearSelectedCard() {
        if (selectedCard) {
          selectedCard.classList.remove("selected");
        }
        selectedCard = null;
        document.getElementById("selectedText").textContent =
          "Bấm chọn một bước, rồi bấm vào vị trí muốn đặt.";
      }

      function refreshPlaceholders() {
        document.querySelectorAll(".slot-content").forEach((content) => {
          if (!content.querySelector(".step-card")) {
            content.textContent = "Kéo bước vào đây";
          }
        });
      }

      function submitAnswers() {
        let correct = 0;

        document.querySelectorAll(".slot").forEach((slot) => {
          const placed = slot.querySelector(".step-card");
          slot.classList.remove("correct", "wrong");

          if (placed && placed.dataset.id === slot.dataset.answer) {
            correct++;
            slot.classList.add("correct");
          } else {
            slot.classList.add("wrong");
          }
        });

        document.getElementById("scoreText").textContent = `${correct}/${steps.length} bước đúng`;
        document.getElementById("answersPanel").classList.remove("hidden");
        document.getElementById("answersPanel").scrollIntoView({ behavior: "smooth", block: "start" });
      }

      document.getElementById("submitBtn").addEventListener("click", submitAnswers);
      document.getElementById("resetBtn").addEventListener("click", initGame);

      initGame();
    </script>
  </body>
</html>

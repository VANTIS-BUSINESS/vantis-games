<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VANTIS Games</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --ink: #0d223f;
        --blue: #2f80ed;
        --teal: #20c5b5;
        --sun: #f4b740;
        --paper: #f7fbff;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        min-height: 100vh;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 14% 10%, rgba(47, 128, 237, 0.14), transparent 30%),
          radial-gradient(circle at 86% 8%, rgba(32, 197, 181, 0.13), transparent 28%),
          linear-gradient(180deg, #ffffff 0%, var(--paper) 58%, #eef7fb 100%);
        color: #102033;
      }

      .wrap {
        margin: 0 auto;
        max-width: 1120px;
        padding: 0 24px;
      }

      .logo {
        height: auto;
        width: min(236px, 58vw);
      }

      .game-card {
        position: relative;
        isolation: isolate;
        transform-style: preserve-3d;
        transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateZ(0);
        box-shadow:
          0 18px 42px rgba(47, 128, 237, 0.11),
          0 8px 20px rgba(13, 34, 63, 0.06),
          inset 0 1px 0 rgba(255, 255, 255, 0.95);
        transition:
          transform 180ms ease,
          box-shadow 180ms ease,
          border-color 180ms ease;
        will-change: transform;
      }

      .game-card::before {
        display: none;
      }

      .game-card::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 24px;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.72), transparent 46%);
        pointer-events: none;
        transform: translateZ(24px);
        z-index: 2;
      }

      .lift {
        position: relative;
        transform: translateZ(38px);
        z-index: 3;
      }

      .game-card:hover,
      .game-card:focus-within {
        border-color: rgba(47, 128, 237, 0.42);
        box-shadow:
          0 24px 54px rgba(47, 128, 237, 0.14),
          0 10px 24px rgba(13, 34, 63, 0.08),
          inset 0 1px 0 rgba(255, 255, 255, 0.95);
      }

      @media (max-width: 767px) {
        .wrap {
          padding: 0 16px;
        }

        .game-card {
          transform: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="min-h-screen">
      <header class="wrap flex items-center py-6">
        <img src="assets/vantis-logo.png" alt="VANTIS" class="logo" />
      </header>

      <section id="games" class="wrap pb-14 pt-8 md:pt-12">
        <div
          id="gamesGrid"
          class="grid grid-cols-1 gap-6 md:grid-cols-2 xl:grid-cols-3"
          aria-label="Danh sách game thực hành"
        ></div>
      </section>
    </main>

    <script>
      const games = [
        {
          title: "Xây dựng Chiến Lược BSC",
          description: "Kéo thả mục tiêu vào đúng 4 góc nhìn BSC.",
          href: "games/bsc-strategy/",
          code: "BSC",
          category: "Chiến lược",
          duration: "5-8 phút",
          tags: ["Balanced Scorecard", "Kéo thả", "Mục tiêu"],
          palette: {
            top: "#2f80ed",
            bottom: "#20c5b5",
            soft: "#eaf6ff",
          },
        },
        {
          title: "Mô hình IDEAL",
          description: "Ghép đúng từng chữ với bước xử lý vấn đề.",
          href: "games/ideal/",
          code: "IDEAL",
          category: "Giải quyết vấn đề",
          duration: "3-5 phút",
          tags: ["IDEAL", "Kéo thả", "Quy trình"],
          palette: {
            top: "#0d223f",
            bottom: "#2f80ed",
            soft: "#eef5ff",
          },
        },
        {
          title: "IDEAL qua ví dụ",
          description: "Nhìn hình và tình huống để đoán đúng từng bước IDEAL.",
          href: "games/ideal-examples/",
          code: "IDEAL",
          category: "Giải quyết vấn đề",
          duration: "4-6 phút",
          tags: ["IDEAL", "Ví dụ", "Nhận diện"],
          palette: {
            top: "#078256",
            bottom: "#f4b740",
            soft: "#f0fbf7",
          },
        },
        {
          title: "Quy trình đội nhóm",
          description: "Kéo thả các bước lớn vào đúng thứ tự quy trình.",
          href: "games/team-process/",
          code: "FLOW",
          category: "Vận hành",
          duration: "4-6 phút",
          tags: ["Quy trình", "Kéo thả", "Đội nhóm"],
          palette: {
            top: "#0f766e",
            bottom: "#2f80ed",
            soft: "#eefaf8",
          },
        },
        {
          title: "Xây dựng mục tiêu - Quản lý hiệu quả",
          description: "Chọn chữ cái đúng để hoàn thiện luồng công việc đạt mục tiêu.",
          href: "games/goal-efficiency/",
          code: "GOAL",
          category: "Quản lý hiệu quả",
          duration: "5-7 phút",
          tags: ["Mục tiêu", "Sơ đồ", "Chọn chữ"],
          palette: {
            top: "#118c61",
            bottom: "#2f80ed",
            soft: "#effaf5",
          },
        },
        {
          title: "Phong cách giao tiếp",
          description: "Nhìn khuôn mặt và từ khóa để đoán đúng phong cách.",
          href: "games/communication-styles/",
          code: "CSI",
          category: "Giao tiếp",
          duration: "4-6 phút",
          tags: ["Giao tiếp", "Đoán ảnh", "Từ khóa"],
          palette: {
            top: "#6b45a8",
            bottom: "#2f80ed",
            soft: "#f4f1ff",
          },
        },
        {
          title: "DISC: Cấu trúc đội ngũ",
          description: "Kéo thả các vị trí công việc vào đúng nhóm DISC.",
          href: "games/disc/",
          code: "DISC",
          category: "Nhân sự",
          duration: "5-7 phút",
          tags: ["DISC", "Kéo thả", "Vai trò"],
          palette: {
            top: "#e94855",
            bottom: "#17813b",
            soft: "#fff7f4",
          },
        },
        {
          title: "Sai lầm của quản lý mới",
          description: "Kéo đúng cụm từ vào từng chỗ trống.",
          href: "games/new-manager-mistakes/",
          code: "9X",
          category: "Quản lý",
          duration: "5-7 phút",
          tags: ["Quản lý mới", "Kéo thả", "Điền khuyết"],
          palette: {
            top: "#e94855",
            bottom: "#2f80ed",
            soft: "#fff4f2",
          },
        },
      ];

      function renderGames() {
        const grid = document.getElementById("gamesGrid");
        const count = document.getElementById("gameCount");

        if (count) {
          count.textContent = games.length;
        }
        grid.innerHTML = games.map(createGameCard).join("");
        attachTilt();
      }

      function createGameCard(game) {
        const tags = game.tags
          .map(
            (tag) =>
              `<span class="rounded-full bg-white/72 px-3 py-1 text-xs font-bold text-slate-600 ring-1 ring-slate-200">${tag}</span>`
          )
          .join("");

        return `
          <article
            class="game-card min-h-[300px] rounded-3xl border bg-white p-5"
            style="border-color: rgba(47, 128, 237, 0.14); background: linear-gradient(145deg, ${game.palette.soft} 0%, #ffffff 42%, #ffffff 100%);"
          >
            <div class="lift mb-6 flex items-start justify-between gap-4">
              <div
                class="grid h-16 w-16 place-items-center rounded-2xl text-lg font-black text-white shadow-xl"
                style="background: linear-gradient(145deg, ${game.palette.top}, ${game.palette.bottom});"
              >
                ${game.code}
              </div>
            </div>

            <div class="lift">
              <p class="text-xs font-black uppercase tracking-[0.18em] text-slate-400">${game.category}</p>
              <h3 class="mt-3 text-2xl font-black leading-tight text-[var(--ink)]">${game.title}</h3>
              <p class="mt-3 text-sm leading-6 text-slate-600">${game.description}</p>
            </div>

            <div class="lift mt-5 flex flex-wrap gap-2">${tags}</div>

            <div class="lift mt-7 flex items-center justify-between gap-4">
              <p class="text-sm font-black text-slate-500">${game.duration}</p>
              <a
                class="inline-flex min-h-11 items-center justify-center rounded-lg bg-[var(--ink)] px-4 text-sm font-black text-white shadow-lg shadow-slate-300 transition hover:bg-slate-900"
                href="${game.href}"
                aria-label="Chơi ${game.title}"
              >
                Chơi ngay
              </a>
            </div>
          </article>
        `;
      }

      function attachTilt() {
        document.querySelectorAll(".game-card").forEach((card) => {
          card.addEventListener("pointermove", (event) => {
            const rect = card.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;
            const ry = (x / rect.width - 0.5) * 12;
            const rx = (0.5 - y / rect.height) * 12;
            card.style.setProperty("--rx", `${rx}deg`);
            card.style.setProperty("--ry", `${ry}deg`);
          });

          card.addEventListener("pointerleave", () => {
            card.style.setProperty("--rx", "0deg");
            card.style.setProperty("--ry", "0deg");
          });
        });
      }

      renderGames();
    </script>
  </body>
</html>
